<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechArrow · Клубы</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><p class="brand">↗ TECHARROW</p><h1>Кабинет клубов</h1><p>Состояние компьютеров и последние запуски обслуживания</p></div><button id="logout" hidden>Выйти</button></header>
<section id="login"><label>Ключ администратора<input id="admin" type="password" autocomplete="off"></label><button id="enter">Войти</button><p>Ключ хранится только в памяти этой страницы.</p></section>
<p id="message" role="status"></p><section id="workspace" hidden><div class="toolbar"><label>Клуб<select id="filter"><option value="">Все клубы</option></select></label><button id="refresh">Обновить</button></div>
<details><summary>Подключить компьютер</summary><div class="registration"><label>Клуб<input id="club" maxlength="80"></label><label>Компьютер<input id="computer" maxlength="80"></label><button id="register">Создать ключ компьютера</button></div><p id="keyResult"></p></details><div id="devices"></div></section></main><script src="app.js"></script></body></html>
